<!DOCTYPE html>
<html lang="en">
<head>

  <meta property="og:description" content="Xmod Json maker V9 - Liquid Glass Edition">
  <meta name="theme-color" content="#00ffaa">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass-bg: rgba(255,255,255,0.07);
      --glass-border: rgba(255,255,255,0.18);
      --glass-highlight: rgba(255,255,255,0.22);
      --glass-shadow: rgba(0,0,0,0.45);
      --accent: #00ffaa;
      --accent2: #00c8ff;
      --accent3: #7b61ff;
      --danger: #ff4466;
      --warn: #ffaa00;
      --info: #00c8ff;
      --text: #e8f0ff;
      --text-dim: rgba(232,240,255,0.55);
      --bg-base: #0a0c14;
      --bg-deep: #060810;
      --ripple: rgba(0,255,170,0.28);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Oxanium', sans-serif;
      background: var(--bg-base);
      color: var(--text);
      min-height: 100vh;
      padding: 0;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(0,200,255,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 80%, rgba(123,97,255,0.1) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(0,255,170,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: bgShift 18s ease-in-out infinite alternate;
    }
    @keyframes bgShift {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0.7; transform: scale(1.06); }
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(60px);
      animation: orbFloat linear infinite;
      opacity: 0.35;
    }
    .orb-1 { width:340px;height:340px;background:radial-gradient(circle,rgba(0,255,170,0.5),transparent 70%); top:-80px;left:-60px;animation-duration:22s;animation-delay:-5s; }
    .orb-2 { width:260px;height:260px;background:radial-gradient(circle,rgba(0,200,255,0.45),transparent 70%); top:40%;right:-80px;animation-duration:28s;animation-delay:-12s; }
    .orb-3 { width:200px;height:200px;background:radial-gradient(circle,rgba(123,97,255,0.5),transparent 70%); bottom:10%;left:20%;animation-duration:19s;animation-delay:-8s; }
    @keyframes orbFloat {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(30px,-40px) scale(1.08); }
      66%      { transform: translate(-20px,30px) scale(0.94); }
    }

    /* Page wrapper */
    .page { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }

    /* Header */
    .site-header {
      text-align: center;
      padding: 32px 0 24px;
      position: relative;
    }
    .site-header h1 {
      font-family: 'Oxanium', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 50%, var(--accent3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 18px rgba(0,255,170,0.4));
      margin-bottom: 4px;
    }
    .site-header .tagline {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /* Glass card */
    .glass-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px 22px;
      margin-bottom: 18px;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow:
        0 8px 32px var(--glass-shadow),
        inset 0 1px 0 var(--glass-highlight),
        inset 0 -1px 0 rgba(0,0,0,0.2);
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.3s, transform 0.3s;
    }
    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      pointer-events: none;
    }
    .glass-card:hover {
      box-shadow:
        0 12px 48px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.3),
        0 0 0 1px rgba(0,255,170,0.15);
    }

    .card-title {
      font-size: 0.7rem;
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title::before {
      content: '';
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      flex-shrink: 0;
    }

    /* Section collapse */
    .collapse-toggle {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .collapse-toggle .chevron {
      width: 14px; height: 14px;
      border-right: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      transform: rotate(45deg);
      transition: transform 0.25s;
      flex-shrink: 0;
    }
    .collapse-toggle.collapsed .chevron { transform: rotate(-45deg); }
    .collapsible { transition: max-height 0.35s ease, opacity 0.3s; overflow: hidden; }
    .collapsible.hidden { max-height: 0 !important; opacity: 0; }

    /* Input row */
    .input-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    /* Search */
    .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 180px;
    }
    .search-wrapper .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      pointer-events: none;
      opacity: 0.5;
    }
    input#search-bar {
      width: 100%;
      padding: 10px 12px 10px 36px;
    }

    /* Inputs & Selects */
    input[type="text"], input[type="number"], input[type="file"], select, textarea {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Oxanium', sans-serif;
      font-size: 0.92rem;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      backdrop-filter: blur(8px);
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      background: rgba(0,255,170,0.06);
      box-shadow: 0 0 0 3px rgba(0,255,170,0.15), inset 0 0 12px rgba(0,255,170,0.04);
    }
    select {
      cursor: pointer;
      flex: 1;
      min-width: 160px;
      max-width: 340px;
    }
    select option {
      background: #111827;
      color: var(--text);
    }
    input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
      height: 4px;
      border-radius: 4px;
    }
    input[type="number"] { width: 80px; }

    /* Ripple button */
    .btn {
      position: relative;
      overflow: hidden;
      border: none;
      border-radius: 12px;
      font-family: 'Oxanium', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      padding: 10px 20px;
      transition: transform 0.15s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.955); }
    .btn::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: var(--ripple);
      width: 0; height: 0;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 1;
      pointer-events: none;
    }
    .btn.rippling::after {
      animation: rippleAnim 0.55s ease-out forwards;
    }
    @keyframes rippleAnim {
      0%   { width: 0; height: 0; transform: translate(-50%, -50%) scale(0); opacity: 0.8; }
      100% { width: 260px; height: 260px; transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    .btn-primary {
      background: linear-gradient(135deg, #00cc88, #00ffaa);
      color: #051a10;
      box-shadow: 0 4px 18px rgba(0,255,170,0.35);
    }
    .btn-primary:hover { box-shadow: 0 6px 28px rgba(0,255,170,0.5); }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.13); }

    .btn-danger {
      background: linear-gradient(135deg, #cc1133, #ff4466);
      color: #fff;
      box-shadow: 0 4px 16px rgba(255,50,80,0.35);
    }
    .btn-info {
      background: linear-gradient(135deg, #0066cc, #00c8ff);
      color: #fff;
      box-shadow: 0 4px 14px rgba(0,200,255,0.35);
    }
    .btn-warn {
      background: linear-gradient(135deg, #cc7700, #ffaa00);
      color: #1a0e00;
      box-shadow: 0 4px 14px rgba(255,170,0,0.3);
    }
    .btn-purple {
      background: linear-gradient(135deg, #5533cc, #7b61ff);
      color: #fff;
      box-shadow: 0 4px 14px rgba(123,97,255,0.35);
    }
    .btn-icon { border-radius: 50%; width: 36px; height: 36px; padding: 0; display:inline-flex;align-items:center;justify-content:center; font-size:1rem; }

    /* Checkbox / toggle */
    .check-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .check-wrap input[type="checkbox"] {
      width: 20px; height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Slider row */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
    }
    .slider-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-dim);
      min-width: 170px;
      cursor: pointer;
      user-select: none;
    }
    .slider-val {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      min-width: 50px;
      text-align: right;
    }
    .slider-row input[type="range"] { flex: 1; }

    /* Color preview */
    .color-preview-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
      padding: 12px 16px;
      background: rgba(0,0,0,0.2);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.07);
    }
    .preview-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .preview-item-wrap {
      position: relative;
      flex-shrink: 0;
    }
    #dispItem {
      width: 80px;
      border-radius: 8px;
      display: block;
    }
    #overlayM {
      position: absolute;
      inset: 0;
      border-radius: 8px;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    /* JSON preview bar */
    #kb {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      color: var(--accent);
      padding: 14px 18px;
      background: rgba(0,255,170,0.05);
      border: 1px solid rgba(0,255,170,0.2);
      border-radius: 12px;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }

    /* Root container */
    #rootContainer { margin-top: 8px; }

    .slot-root {
      margin-bottom: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 12px 16px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 20px var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
      font-size: 0.9rem;
      letter-spacing: 0.03em;
    }
    .slot-root::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      pointer-events: none;
    }
    .slot-root:hover { border-color: rgba(0,255,170,0.3); box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,255,170,0.12); }

    /* Item label */
    .itemCl {
      display: block;
      margin-left: 18px;
      margin-top: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      font-size: 0.86rem;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      overflow: hidden;
    }
    .itemCl::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      pointer-events: none;
    }
    .itemCl:hover { background: rgba(255,255,255,0.09); border-color: rgba(0,255,170,0.25); }
    .mRoot {
      background: var(--glass-bg) !important;
      border: 1px solid var(--glass-border) !important;
      margin-left: 0 !important;
      border-radius: 16px !important;
      margin-bottom: 12px;
      padding: 12px 16px !important;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 200;
      inset: 0;
      background: rgba(6,8,16,0.72);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
    }
    .modal.open { display: flex; animation: modalIn 0.2s ease; }
    @keyframes modalIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .modal-content {
      background: rgba(14,18,30,0.9);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 26px 24px;
      width: 320px;
      max-width: 95vw;
      box-shadow: 0 24px 64px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.12);
      backdrop-filter: blur(30px);
      animation: modalSlide 0.22s cubic-bezier(.17,.67,.27,1.1);
    }
    @keyframes modalSlide {
      from { transform: translateY(24px) scale(0.97); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }
    .modal-title {
      font-size: 0.72rem;
      font-family: 'Space Mono', monospace;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-title::before { content: ''; width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);flex-shrink:0; }
    .modal-buttons { display: flex; flex-direction: column; gap: 10px; }
    .modal-btn { width: 100%; }
    .duplicate-input {
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px;
    }

    /* Share section */
    .file-list-item {
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      margin-bottom: 6px;
      transition: background 0.2s;
    }
    .file-list-item:hover { background: rgba(255,255,255,0.08); }
    .file-list-item a { color: var(--accent); text-decoration: none; font-size: 0.9rem; }

    /* Help tooltip */
    .help-btn {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.07);
      color: var(--text-dim);
      font-size: 0.75rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      transition: border-color 0.2s, color 0.2s;
    }
    .help-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Divider */
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 14px 0;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,255,170,0.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,255,170,0.5); }

    /* Responsive */
    @media (max-width: 600px) {
      .input-row { gap: 8px; }
      select { max-width: 100%; }
      .slider-label { min-width: 130px; font-size: 0.68rem; }
    }
  </style>
</head>

  <script>
    // ── Ripple helper ──────────────────────────────────────────
    document.addEventListener('click', e => {
      const btn = e.target.closest('.btn');
      if (!btn) return;
      btn.classList.remove('rippling');
      void btn.offsetWidth;
      btn.classList.add('rippling');
      btn.addEventListener('animationend', () => btn.classList.remove('rippling'), { once: true });
    });

    // ── Card collapse ──────────────────────────────────────────
    function toggleCard(toggle) {
      const target = document.getElementById(toggle.dataset.target);
      const collapsed = toggle.classList.toggle('collapsed');
      target.classList.toggle('hidden', collapsed);
    }

    // ── Slider prompt ──────────────────────────────────────────
    function promptVal(sliderId, label, min, max, offset) {
      const a = prompt(`${label} (${min} to ${max})`);
      const n = parseInt(a);
      if (isNaN(n) || n < min || n > max) return;
      const s = document.getElementById(sliderId);
      s.value = n + offset;
      s.dispatchEvent(new Event('input'));
    }

    // ── Color helpers ──────────────────────────────────────────
    function hueSaturationToRGB(hue, saturation) {
      const hue2 = (hue / 240) * 325;
      const sat2 = ((saturation / 248) * 164) + 84;
      const s = sat2 / 120;
      const c = s * 255;
      const x = c * (1 - Math.abs((hue2 / 60) % 2 - 1));
      const m = 255 - c;
      let r, g, b;
      if      (hue2 < 60)  { r=c; g=x; b=0; }
      else if (hue2 < 120) { r=x; g=c; b=0; }
      else if (hue2 < 180) { r=0; g=c; b=x; }
      else if (hue2 < 240) { r=0; g=x; b=c; }
      else if (hue2 < 300) { r=x; g=0; b=c; }
      else                 { r=c; g=0; b=x; }
      const inv = saturation / 248;
      r = Math.round((r+m)*inv + (255-(r+m))*(1-inv));
      g = Math.round((g+m)*inv + (255-(g+m))*(1-inv));
      b = Math.round((b+m)*inv + (255-(b+m))*(1-inv));
      return `rgb(${r},${g},${b}`;
    }

    function updateOverlay() {
      const cl = document.getElementById('color-sl');
      const sr = document.getElementById('sat-sl');
      document.getElementById('overlayM').style.background =
        hueSaturationToRGB(cl.value, sr.value) + ',0.5)';
    }

    // Slider events
    const cl = document.getElementById('color-sl');
    const sr = document.getElementById('sat-sl');
    cl.oninput = () => { document.getElementById('colorVal').textContent = cl.value; updateOverlay(); };
    sr.oninput = () => { document.getElementById('satVal').textContent = sr.value - 124; updateOverlay(); };
    document.getElementById('size-sl').oninput = function() {
      document.getElementById('sizeVal').textContent = this.value - 128;
      document.getElementById('dispItem').style.width = ((this.value / 127) * 85 + 32) + 'px';
    };
    document.getElementById('state-sl').oninput = function() { document.getElementById('stateVal').textContent = this.value; };
    document.getElementById('ammo-sl').oninput  = function() { document.getElementById('ammoVal').textContent = this.value; };
    updateOverlay();

    // ── Search bar ──────────────────────────────────────────────
    const searchBar = document.getElementById('search-bar');
    const selectBox = document.getElementById('item-selected');
    searchBar.addEventListener('input', () => {
      const q = searchBar.value.toLowerCase();
      for (const opt of selectBox.options) {
        opt.hidden = !opt.text.toLowerCase().includes(q);
      }
      if (selectBox.selectedOptions[0]?.hidden) {
        const first = Array.from(selectBox.options).find(o => !o.hidden);
        if (first) selectBox.value = first.value;
      }
    });

    // ── Root management ─────────────────────────────────────────
    var rootCurrent = document.getElementById('rightHandRoot');
    var recentItemCreated = null;
    var bB = true;
    var currentClickedElement = null;
    const ROOTS = ['rightHandRoot','leftHandRoot','rightHipRoot','leftHipRoot','backRoot'];

    function setRoot(el) { rootCurrent = el; }
    function getDepth(el) {
      let d=0; while(el.parentNode && el.parentNode.className!=='mRoot'){d++;el=el.parentNode;} return d;
    }

    // ── Add item ─────────────────────────────────────────────────
    function addItem() {
      const rootId = rootCurrent.id;
      const isSlotRoot = ROOTS.includes(rootId) && rootCurrent.classList.contains('mRoot');
      if (isSlotRoot && rootCurrent.children.length > 0) {
        window.alert("Can't put more than one item into a slot! 🤣"); return;
      }
      const item = document.getElementById('item-selected');
      let amount = isSlotRoot ? 1 : parseInt(document.getElementById('Amount').value) || 1;
      for (let i = 0; i < amount; i++) {
        const rng = document.getElementById('rngItem').checked && bB;
        const opts = Array.from(item.options).filter(o => !o.hidden);
        const chosen = rng ? opts[Math.floor(Math.random()*opts.length)] : item.options[item.selectedIndex];
        const size  = document.getElementById('sR').checked  ? Math.round(Math.random()*255)-128 : +document.getElementById('size-sl').value-128;
        const color = document.getElementById('cR').checked  ? Math.round(Math.random()*240)     : +document.getElementById('color-sl').value;
        const satu  = document.getElementById('saR').checked ? Math.round(Math.random()*248)-124 : +document.getElementById('sat-sl').value-124;
        const state = document.getElementById('vR').checked  ? Math.round(Math.random()*8000)    : +document.getElementById('state-sl').value;
        const ammo  = document.getElementById('aR').checked  ? Math.round(Math.random()*2)       : +document.getElementById('ammo-sl').value;
        const el = document.createElement('label');
        el.textContent = chosen.text;
        el.setAttribute('ACvalue', chosen.value);
        if (color!==0) el.setAttribute('colorHue', color);
        if (size!==0)  el.setAttribute('scaleModifier', size);
        if (satu!==0)  el.setAttribute('colorSaturation', satu);
        if (chosen.value==='item_shredder' && state!==0) el.setAttribute('state', state);
        if (chosen.value==='item_shotgun'  && ammo!==0)  el.setAttribute('ammo', ammo);
        el.className = 'itemCl';
        el.onclick = function(e) { e.stopPropagation(); manageItem(this); };
        el.style.background = hueSaturationToRGB(color, satu+124) + ',0.25)';
        el.style.borderColor = hueSaturationToRGB(color, satu+124) + ',0.4)';
        rootCurrent.appendChild(el);
        recentItemCreated = el;
      }
    }

    // ── Modal ────────────────────────────────────────────────────
    function manageItem(el) {
      el.style.outline = '2px solid var(--accent)';
      currentClickedElement = el;
      document.getElementById('itemModal').classList.add('open');
    }
    function closeModal() {
      document.getElementById('itemModal').classList.remove('open');
      document.getElementById('duplicateInputContainer').style.display = 'none';
      if (currentClickedElement) { currentClickedElement.style.outline = ''; currentClickedElement = null; }
    }
    function showDuplicateInput() { document.getElementById('duplicateInputContainer').style.display='block'; }
    document.getElementById('itemModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });

    function handleModalAction(action) {
      if (!currentClickedElement) return;
      switch(action) {
        case 1: setRoot(currentClickedElement); break;
        case 2:
          if (!currentClickedElement.classList.contains('mRoot') && currentClickedElement.parentNode) {
            currentClickedElement.parentNode.removeChild(currentClickedElement);
          } else { alert("Can't delete root slots!"); }
          break;
        case 3: {
          const n = parseInt(document.getElementById('duplicateCount').value)||1;
          if (!currentClickedElement.classList.contains('mRoot')) {
            for (let i=0;i<n;i++) {
              const dup = currentClickedElement.cloneNode(true);
              dup.onclick = function(e){e.stopPropagation();manageItem(this);};
              currentClickedElement.parentNode.appendChild(dup);
            }
          } else alert('Cannot duplicate root slots!');
          break;
        }
        case 4:
          for (const ch of currentClickedElement.children)
            ch.style.display = ch.style.display==='none' ? 'block' : 'none';
          break;
      }
      kbUpd(); closeModal();
    }

    // ── JSON compile ──────────────────────────────────────────────
    function compileItem(el) {
      const obj = { itemID: el.getAttribute('ACvalue') };
      if (el.getAttribute('colorHue')!=null)       obj.colorHue       = parseFloat(el.getAttribute('colorHue'));
      if (el.getAttribute('colorSaturation')!=null) obj.colorSaturation= parseFloat(el.getAttribute('colorSaturation'));
      if (el.getAttribute('scaleModifier')!=null)   obj.scaleModifier  = parseFloat(el.getAttribute('scaleModifier'));
      if (el.getAttribute('state')!=null)           obj.state          = parseInt(el.getAttribute('state'),10);
      if (el.getAttribute('ammo')!=null)            obj.ammo           = parseInt(el.getAttribute('ammo'),10);
      if (el.children.length>0) obj.children = Array.from(el.children).map(compileItem);
      return obj;
    }
    function getSlot(id) { return Array.from(document.getElementById(id).children).map(compileItem); }

    function kbUpd() {
      const data = {
        rightHand: getSlot('rightHandRoot'),
        leftHand:  getSlot('leftHandRoot'),
        leftHip:   getSlot('leftHipRoot'),
        rightHip:  getSlot('rightHipRoot'),
        back:      getSlot('backRoot')
      };
      const str = JSON.stringify(data);
      const kb  = (new Blob([str]).size/1024).toFixed(2);
      document.getElementById('kb').textContent = `your json · ${kb} kb`;
    }

    function dlJson() {
      const rightAry = getSlot('rightHandRoot');
      const leftAry  = getSlot('leftHandRoot');
      const leftHAry = getSlot('leftHipRoot');
      const rightHAry= getSlot('rightHipRoot');
      const backAry  = getSlot('backRoot');
      let out = JSON.stringify({
        version: 1,
        "xmod-json-maker-v9": "",
        leftHand:  leftAry.length  ? leftAry[0]   : {},
        rightHand: rightAry.length ? rightAry[0]  : {},
        leftHip:   leftHAry.length ? leftHAry[0]  : {},
        rightHip:  rightHAry.length? rightHAry[0] : {},
        back:      backAry.length  ? backAry[0]   : {}
      }, null, 2);
      out = out.replace(/^\s+/gm,'').replace(/: /g,':').replace(/, /g,',').replace(/\s+$/gm,'') + '\n';
      const name = prompt('Name for your JSON file?') || 'xmod';
      const blob = new Blob([out], {type:'application/json'});
      const a = document.createElement('a');
      a.download = name + ' V9 Maker.json';
      a.href = URL.createObjectURL(blob);
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    // ── Bypass bag ────────────────────────────────────────────────
    function createAlot() {
      bB = false;
      const r = parseInt(prompt('Which slot? (1=rightHand 2=leftHand 3=rightHip 4=leftHip 5=back)'));
      const rootIds = ['','rightHandRoot','leftHandRoot','rightHipRoot','leftHipRoot','backRoot'];
      let rootOp = document.getElementById(rootIds[r]||'rightHandRoot');
      const itemSel = document.getElementById('item-selected');
      let amt = parseInt(prompt(`How many ${itemSel.options[itemSel.selectedIndex].text}'s in one bag?`));
      if (isNaN(amt)||amt<1) amt=1;
      if (amt>3500){amt=3500;alert('Capped at 3500 items.');}
      amt = Math.round(amt);
      let itemSave = itemSel.value;
      if (rootOp.children.length>0) rootOp.removeChild(rootOp.children[0]);
      setRoot(rootOp);
      itemSel.value='item_backpack_large_base'; addItem();
      let alotRoot = rootOp.children[0];
      let bagAmnt = Math.ceil(amt/23);
      let layersNeeded = Math.ceil(bagAmnt/23);
      rootOp.removeChild(rootOp.children[0]);
      setRoot(rootOp); itemSel.value='item_backpack_large_base'; addItem();
      alotRoot = rootOp.children[0];
      let bagsMade=0, itemsMade=0;
      const amtSave = document.getElementById('Amount').value;
      document.getElementById('Amount').value=1;
      setRoot(alotRoot);
      for (let x=0;x<layersNeeded;x++) {
        for (let x2=0;x2<23;x2++) {
          if (bagsMade===bagAmnt) break;
          itemSel.value='item_heart_gun'; addItem(); setRoot(recentItemCreated);
          itemSel.value='item_backpack_large_base'; addItem(); setRoot(recentItemCreated);
          if (x2!==22) {
            for (let x3=0;x3<23;x3++) {
              if (itemsMade===amt) break;
              if (document.getElementById('rngItem').checked) {
                const visOpts=Array.from(itemSel.options).filter(o=>!o.hidden);
                itemSave=visOpts[Math.floor(Math.random()*visOpts.length)].value;
              }
              const needsWrap = itemSave.includes('backpack')||itemSave.includes('cardb')||itemSave==='item_shredder'||itemSave==='item_pelican_case'||itemSave.includes('quiver')||itemSave.includes('hover')||document.getElementById('explodeMode').checked;
              if (needsWrap){itemSel.value='item_heart_gun';addItem();setRoot(recentItemCreated);}
              if (itemSave.includes('landmine')){itemSel.value='item_crossbow';addItem();setRoot(recentItemCreated);}
              itemSel.value=itemSave; addItem();
              if (needsWrap||itemSave.includes('landmine')) setRoot(recentItemCreated.parentNode.parentNode);
              itemsMade++;
            }
          }
          setRoot(alotRoot); bagsMade++;
        }
        alotRoot=recentItemCreated;
      }
      itemSel.value=itemSave;
      document.getElementById('Amount').value=amtSave;
      setRoot(rootOp);
      alert('Done! 🎉');
      kbUpd(); bB=true;
    }

    // ── File sharing ──────────────────────────────────────────────
    async function uploadJson() {
      const fi=document.getElementById('jsonFile'),fn=document.getElementById('fileName').value.trim(),au=document.getElementById('authorName').value.trim();
      if(!fi.files[0]||!fn||!au){alert('Please fill in all fields and select a JSON file.');return;}
      if(!fi.files[0].name.endsWith('.json')){alert('Only JSON files allowed.');return;}
      try{JSON.parse(await fi.files[0].text());}catch{alert('Invalid JSON.');return;}
      const fd=new FormData();fd.append('file',fi.files[0]);fd.append('fileName',fn);fd.append('authorName',au);
      const r=await fetch('/api/upload',{method:'POST',body:fd});
      alert(r.ok?'Uploaded!':'Upload error.');
      if(r.ok) fetchFileList();
    }
    async function fetchFileList() {
      try{
        const r=await fetch('/api/files'); const files=await r.json();
        const fl=document.getElementById('fileList'); fl.innerHTML='';
        files.forEach(f=>{
          const d=document.createElement('div'); d.className='file-list-item';
          const a=document.createElement('a'); a.href=`/api/download/${f}`; a.textContent=f; a.target='_blank';
          d.appendChild(a); fl.appendChild(d);
        });
      }catch(e){/* server not running locally */}
    }
    window.onload=()=>{fetchFileList();kbUpd();};
  </script>
</body>
