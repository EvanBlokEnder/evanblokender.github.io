<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Me - EvanBlokEnder</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #08090d;
      color: #e8e8e8;
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      max-width: 900px;
      margin: 30px auto 0;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 24px;
      color: #9bd8ff;
      letter-spacing: 1px;
    }

    .button {
      color: #cfeeff;
      text-decoration: none;
      border: 1px solid #23475f;
      padding: 8px 14px;
      border-radius: 8px;
      background: #101923;
      transition: 0.2s;
    }

    .button:hover {
      background: #172637;
      transform: translateY(-2px);
    }

    .container {
      max-width: 900px;
      margin: 70px auto;
      padding: 0 20px;
    }

    .card {
      background: #101116;
      border: 1px solid #242733;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .card h2 {
      font-size: 32px;
      margin-bottom: 15px;
      color: #ffffff;
    }

    .card p {
      color: #c9c9c9;
      font-size: 17px;
      max-width: 650px;
    }

    .tag {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #132030;
      color: #8fd3ff;
      font-size: 14px;
      border: 1px solid #26384a;
    }

    footer {
      max-width: 900px;
      margin: 80px auto 30px;
      padding: 0 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html" class="button">Home</a>
    <h1>EvanBlokEnder</h1>
  </header>

  <main class="container">
    <section class="card">
      <h2>About Me</h2>
      <p>
        Hey, I'm EvanBlokEnder. I play Beat Saber VR and I'm ranked around top 5000.
        I mostly mess around with games, code, and random projects.
      </p>

      <span class="tag">Beat Saber Player</span>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 EvanBlokEnder. All Rights Reserved.</p>
  </footer>
</body>
</html>
